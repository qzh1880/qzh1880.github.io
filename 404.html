<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        /* NostylePlease 原生极简风格，不引入外部资源，纯基础css */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            max-width: 650px;
            margin: 6rem auto;
            padding: 0 1.2rem;
            font-family: system-ui, -apple-system, Helvetica, Arial, sans-serif;
            line-height: 1.65;
            color: #111;
            background-color: #fff;
        }
        h1 {
            font-size: 3.2rem;
            font-weight: normal;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.05rem;
            margin-bottom: 2rem;
            color: #333;
        }
        a.button-home {
        color: #0055aa;
        text-decoration: underline;
        }
        a.button-home:hover {
        color: #003366;
        }

        .tips {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>抱歉，你访问的页面不存在、已被移除或者链接有误。</p>

    <a href="/" class="button-home">返回首页</a>

    <div class="tips">
        <p>你可以检查网址是否拼写正确，或回到主页浏览更多内容。</p>
    </div>
</body>
</html>
